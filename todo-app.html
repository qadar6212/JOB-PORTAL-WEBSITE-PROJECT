<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App - Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4988C4;
            --secondary: #00e5ff;
            --danger: #ff6b6b;
            --success: #51cf66;
            --warning: #ffa500;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --border: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--dark));
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95em;
        }

        /* Main Content */
        .content {
            padding: 30px;
        }

        /* Input Section */
        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        #taskInput {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(73, 136, 196, 0.3);
        }

        .add-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(73, 136, 196, 0.4);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        /* Filter Section */
        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            background: var(--light);
            border: 2px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-btn:hover {
            border-color: var(--primary);
        }

        /* Task List */
        .task-list {
            list-style: none;
        }

        .task-item {
            background: var(--light);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .task-item.completed {
            background: rgba(81, 207, 102, 0.1);
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .task-content {
            flex: 1;
        }

        .task-text {
            font-size: 1em;
            color: var(--dark);
            word-break: break-word;
        }

        .task-date {
            font-size: 0.8em;
            color: #888;
            margin-top: 5px;
        }

        .task-priority {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            margin-top: 5px;
        }

        .priority-high {
            background: rgba(255, 107, 107, 0.2);
            color: var(--danger);
        }

        .priority-medium {
            background: rgba(255, 165, 0, 0.2);
            color: var(--warning);
        }

        .priority-low {
            background: rgba(81, 207, 102, 0.2);
            color: var(--success);
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .task-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .edit-btn {
            color: var(--primary);
        }

        .edit-btn:hover {
            background: rgba(73, 136, 196, 0.2);
        }

        .delete-btn {
            color: var(--danger);
        }

        .delete-btn:hover {
            background: rgba(255, 107, 107, 0.2);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.1em;
        }

        /* Stats Section */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: var(--light);
            border-radius: 8px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid var(--light);
        }

        .control-btn {
            padding: 10px 20px;
            background: var(--light);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .control-btn.danger {
            border-color: var(--danger);
            color: var(--danger);
        }

        .control-btn.danger:hover {
            background: var(--danger);
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: var(--dark);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 5px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(73, 136, 196, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .modal-btn.save {
            background: var(--success);
            color: white;
        }

        .modal-btn.save:hover {
            background: #40a852;
        }

        .modal-btn.cancel {
            background: var(--light);
            border: 2px solid var(--border);
        }

        .modal-btn.cancel:hover {
            background: var(--border);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .input-section {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .control-btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* Dark Mode */
        body.dark-mode {
            background: linear-gradient(135deg, #1e3a5f, #0d1b2a);
        }

        body.dark-mode .container {
            background: #2c3e50;
            color: #ecf0f1;
        }

        body.dark-mode .header {
            background: linear-gradient(135deg, #1a2634, #0d1619);
        }

        body.dark-mode #taskInput {
            background: #34495e;
            color: #ecf0f1;
            border-color: #555;
        }

        body.dark-mode .task-item {
            background: #34495e;
        }

        body.dark-mode .task-text {
            color: #ecf0f1;
        }

        body.dark-mode .filter-section {
            background: none;
        }

        body.dark-mode .filter-btn {
            background: #34495e;
            border-color: #555;
            color: #ecf0f1;
        }

        body.dark-mode .stats {
            background: #34495e;
        }

        body.dark-mode .modal-content {
            background: #2c3e50;
            color: #ecf0f1;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.3em;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
            z-index: 999;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        body.dark-mode .theme-toggle {
            background: #34495e;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <!-- Theme Toggle -->
    <button class="theme-toggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-tasks"></i>
                My Tasks
            </h1>
            <p>Stay organized and boost your productivity</p>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Stats -->
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="pendingTasks">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="Add a new task..." 
                        onkeypress="handleKeyPress(event)"
                    >
                </div>
                <button class="add-btn" onclick="addTask()">
                    <i class="fas fa-plus"></i> Add
                </button>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <button class="filter-btn active" onclick="filterTasks('all')">
                    <i class="fas fa-th"></i> All
                </button>
                <button class="filter-btn" onclick="filterTasks('active')">
                    <i class="fas fa-circle"></i> Active
                </button>
                <button class="filter-btn" onclick="filterTasks('completed')">
                    <i class="fas fa-check-circle"></i> Completed
                </button>
                <button class="filter-btn" onclick="filterTasks('high')">
                    <i class="fas fa-exclamation-circle"></i> High Priority
                </button>
            </div>

            <!-- Task List -->
            <ul class="task-list" id="taskList"></ul>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-clipboard"></i>
                <p>No tasks yet! Add one to get started 🚀</p>
            </div>

            <!-- Control Buttons -->
            <div class="controls">
                <button class="control-btn" onclick="openAddModal()">
                    <i class="fas fa-plus-circle"></i> Add Detailed Task
                </button>
                <button class="control-btn" onclick="exportTasks()">
                    <i class="fas fa-download"></i> Export
                </button>
                <button class="control-btn danger" onclick="clearCompleted()">
                    <i class="fas fa-trash"></i> Clear Completed
                </button>
                <button class="control-btn danger" onclick="clearAll()">
                    <i class="fas fa-times-circle"></i> Clear All
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-edit"></i> Edit Task
            </div>
            <div class="form-group">
                <label>Task Description</label>
                <textarea id="editTaskText" placeholder="Enter task description..."></textarea>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select id="editTaskPriority">
                    <option value="low">Low Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" id="editTaskDate">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn save" onclick="saveEditedTask()">
                    <i class="fas fa-save"></i> Save
                </button>
                <button class="modal-btn cancel" onclick="closeModal()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Add Detailed Task Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-plus-circle"></i> Add New Task
            </div>
            <div class="form-group">
                <label>Task Description</label>
                <textarea id="newTaskText" placeholder="Enter task description..."></textarea>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select id="newTaskPriority">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" id="newTaskDate">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn save" onclick="addDetailedTask()">
                    <i class="fas fa-plus"></i> Add Task
                </button>
                <button class="modal-btn cancel" onclick="closeModal()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="todo-app.js"></script>
</body>
</html>
